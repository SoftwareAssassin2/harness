# The harness project's golden VM (ASS-69, ASS-72), built by `agent.sh vm:build-golden harness`.
minimumLimaVersion: 2.0.0
vmType: vz
images:
- location: "https://cloud.debian.org/images/cloud/trixie/20261001-2618/debian-13-genericcloud-arm64-20261001-2618.qcow2"
  arch: "aarch64"
  digest: "sha512:d8470b8c6c38fead046c794b5800a5a7b96672d5bcf543cc230ceb0c4b8ace05ed341a0c8928045422243fde26b2f1f2f58e99244c65709ffda2e3d4b674dd5a"
cpus: 4
memory: 4GiB
disk: 30GiB
# Nothing from the host is mounted into a golden image; a clone gets only its ticket folder at /mnt/ticket.
mounts: []
mountType: virtiofs
networks:
- vzNAT: true
vmOpts:
  vz:
    rosetta:
      enabled: false
      binfmt: false
# ASS-76: no display. With "vz" (or "default") Lima's vz driver gives the VM a virtio-gpu display and
# its host agent opens a native window ("Lima: <instance>") on the Mac at every start (limactl start
# --video sets "default"). The Demo action turns it on for its VM only.
video:
  display: "none"
containerd:
  system: false
  user: false
provision:
- mode: system
  script: |
    #!/bin/sh
    # ASS-69: the vzNAT path drops packets near 1500 bytes (SSH KEX hangs); 1400 works.
    ip link set lima0 mtu 1400
