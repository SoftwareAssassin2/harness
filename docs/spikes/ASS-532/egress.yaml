# ASS-532 spike: dummy credentials (never real ones), the provider's namespace
# grant, for the credential-injection test. Apply, then restart the provider
# (it reads the policy only at start).
apiVersion: v1
kind: Namespace
metadata: { name: spike-creds }
---
apiVersion: v1
kind: Secret
metadata: { name: anthropic, namespace: spike-creds }
type: Opaque
stringData: { key: "sk-ant-DUMMY-not-a-real-key-1" }
---
apiVersion: v1
kind: Secret
metadata: { name: gitlab, namespace: spike-creds }
type: Opaque
stringData:
  token: "glpat-DUMMY-not-a-real-token-1"
  # git over HTTPS sends Basic base64(user:token); the gateway prefixes, it does
  # not encode, so the Basic value is stored pre-encoded: base64("oauth2:glpat-DUMMY-not-a-real-token-1")
  basic: "b2F1dGgyOmdscGF0LURVTU1ZLW5vdC1hLXJlYWwtdG9rZW4tMQ=="
---
apiVersion: v1
kind: ConfigMap
metadata: { name: k8s-credential-provider-namespace-policy, namespace: ate-system }
data:
  namespace-policy.yaml: |
    policies:
    - atespace: harness-tickets
      allowedNamespaces: [spike-creds]
